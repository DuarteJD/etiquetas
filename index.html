<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador de Etiquetas — ZPL · EPL · PPLA</title>
<style>
  @font-face{font-family:"Roboto Condensed";font-weight:700;src:url(fonts/roboto-condensed-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Roboto Mono";font-weight:700;src:url(fonts/roboto-mono-latin-700-normal.woff2) format("woff2")}
  :root{
    --bg:#eceae4; --panel:#f8f7f3; --ink:#1d1d1b; --muted:#6b6960; --line:#d6d3c9;
    --accent:#d9481c; --accent-ink:#fff; --code-bg:#1f2124; --code-ink:#e8e6df; --warn:#9a5b00;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181a; --panel:#202225; --ink:#eceae4; --muted:#9a978d; --line:#33363a; --code-bg:#121315; --code-ink:#e8e6df; --warn:#f0b050; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  header h1 .tag{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:500;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:3px}
  .spacer{flex:1}
  main{flex:1;display:grid;grid-template-columns:minmax(320px,42%) 1fr;min-height:0}
  @media (max-width:860px){ main{grid-template-columns:1fr;grid-template-rows:auto auto} }
  .left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;min-width:0}
  .toolbar{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  select,input[type=number],input[type=text]{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
  button,.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
  button:hover,.btn:hover{border-color:var(--ink)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  textarea{flex:1;min-height:260px;resize:none;border:0;outline:0;padding:12px 14px;font-family:ui-monospace,Consolas,ui-monospace,monospace;font-size:12.5px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);tab-size:4;white-space:pre;overflow:auto}
  .drop{outline:3px dashed var(--accent);outline-offset:-8px}
  .right{display:flex;flex-direction:column;min-height:0;min-width:0}
  .status{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px;flex-wrap:wrap}
  .status .pill{font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
  .status .pill.lang{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .stage{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;align-items:center;gap:26px;
    background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
  .labelwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .labelwrap .cap{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted)}
  .paper{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15),0 8px 24px rgba(0,0,0,.12);border-radius:6px;line-height:0;position:relative}
  .paper img{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:6px}
  .warns{max-height:140px;overflow:auto;border-top:1px solid var(--line);background:var(--panel);font-size:12px;padding:8px 14px;color:var(--warn);font-family:ui-monospace,Consolas,monospace}
  .warns:empty{display:none}
  .warns div{padding:1px 0}
  .coord{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);min-width:140px}
  .hint{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;margin-top:60px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>Visualizador de Etiquetas <span class="tag">ZPL</span><span class="tag">EPL</span><span class="tag">PPLA</span></h1>
  <div class="spacer"></div>
  <span class="hint">Cole o código ou arraste o arquivo .txt / .prn para o editor</span>
</header>
<main>
  <section class="left">
    <div class="toolbar">
      <button class="primary" id="btnOpen">Abrir arquivo…</button>
      <input type="file" id="file" accept=".txt,.prn,.zpl,.epl,.ppla,.lbl,text/plain" hidden>
      <select id="example" style="width:auto">
        <option value="">Exemplos…</option>
        <option value="zpl">ZPL (Zebra)</option>
        <option value="epl">EPL2 (Zebra / Elgin)</option>
        <option value="ppla">PPLA (Argox)</option>
      </select>
      <button id="btnClear">Limpar</button>
    </div>
    <div class="opts">
      <label class="f">Linguagem
        <select id="lang"><option value="auto">Detectar</option><option value="zpl">ZPL</option><option value="epl">EPL</option><option value="ppla">PPLA</option></select>
      </label>
      <label class="f">Resolução
        <select id="dpi"><option value="152">152 dpi (6 dpmm)</option><option value="203" selected>203 dpi (8 dpmm)</option><option value="300">300 dpi (12 dpmm)</option><option value="600">600 dpi (24 dpmm)</option></select>
      </label>
      <label class="f">Largura (mm)<input type="number" id="wmm" value="100" min="5" step="1"></label>
      <label class="f">Altura (mm)<input type="number" id="hmm" value="50" min="5" step="1"></label>
      <label class="f">Tamanho
        <select id="sizeMode"><option value="file">Usar do arquivo, se houver</option><option value="manual">Sempre o informado</option></select>
      </label>
      <label class="f">Origem PPLA
        <select id="pplaOrigin"><option value="bottom">Inferior esquerda</option><option value="top">Superior esquerda</option></select>
      </label>
      <label class="f">Girar visualização
        <select id="viewRot"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
      </label>
      <label class="f">Zoom
        <select id="zoom"><option value="fit">Ajustar</option><option value="0.5">50%</option><option value="1">100% (1 ponto = 1 px)</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select>
      </label>
    </div>
    <textarea id="src" spellcheck="false" placeholder="Cole aqui o código ZPL, EPL ou PPLA…"></textarea>
  </section>
  <section class="right">
    <div class="status">
      <span class="pill lang" id="stLang">—</span>
      <span class="pill" id="stSize">—</span>
      <span class="pill" id="stCount">—</span>
      <span class="spacer"></span>
      <span class="coord" id="coord"></span>
    </div>
    <div class="stage" id="stage"><div class="empty">Nenhuma etiqueta ainda.<br>Abra um arquivo, cole o código ou escolha um exemplo.</div></div>
    <div class="warns" id="warns"></div>
  </section>
</main>

<script src="vendor/bwip-js-min.js"></script>
<script>
"use strict";
/* =====================================================================
   Visualizador de etiquetas — ZPL / EPL2 / PPLA
   Arquitetura: cada linguagem tem um parser que gera uma lista de
   "operações" em pontos (dots) da impressora; o renderizador desenha
   essas operações num canvas do tamanho exato da etiqueta.
   ===================================================================== */

/* ------------------------- utilidades ------------------------------ */
const $ = id => document.getElementById(id);
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const int = (v, d) => { const n = parseInt(v, 10); return isFinite(n) ? n : d; };
const VECTOR_FONT = '"Roboto Condensed","Arial Narrow","Liberation Sans Narrow",Arial,sans-serif';
const MONO_FONT = '"Roboto Mono","DejaVu Sans Mono",Consolas,"Courier New",monospace';

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  return c;
}

class Label {
  constructor(w, h) { this.w = w; this.h = h; this.ops = []; this.rot180 = false; this.copies = 1; }
}

/* ------------------------- texto ----------------------------------- */
// font: {kind:'vector', h, w}  ou  {kind:'mono', h, cw, gap}
let measureCtx = null;
function mctx() { if (!measureCtx) measureCtx = newCanvas(4, 4).getContext('2d'); return measureCtx; }

function vectorMetrics(font) {
  const px = font.h;
  const sx = (font.w || font.h) / font.h;
  return { px, sx, css: `700 ${px}px ${VECTOR_FONT}`, baseline: Math.round(px * 0.78) };
}
function textWidth(str, font) {
  if (font.kind === 'mono') return str.length * (font.cw + font.gap);
  const m = vectorMetrics(font); const c = mctx(); c.font = m.css;
  return c.measureText(str).width * m.sx;
}
function fontLineHeight(font) { return font.h; }
function fontBaseline(font) { return font.kind === 'mono' ? Math.round(font.h * 0.8) : vectorMetrics(font).baseline; }

function drawTextLine(ctx, str, font, x, y /* topo da linha */, color) {
  ctx.fillStyle = color;
  if (font.kind === 'mono') {
    const px = font.h * 1.02;
    ctx.font = `700 ${px}px ${MONO_FONT}`;
    ctx.textBaseline = 'alphabetic';
    const adv = ctx.measureText('M').width || px * 0.6;
    const sx = font.cw / adv;
    const base = y + fontBaseline(font);
    for (let i = 0; i < str.length; i++) {
      ctx.save();
      ctx.translate(x + i * (font.cw + font.gap), base);
      ctx.scale(sx, 1);
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
    }
  } else {
    const m = vectorMetrics(font);
    ctx.font = m.css; ctx.textBaseline = 'alphabetic';
    ctx.save(); ctx.translate(x, y + m.baseline); ctx.scale(m.sx, 1); ctx.fillText(str, 0, 0); ctx.restore();
  }
}

function wrapText(text, font, width) {
  const out = [];
  for (const para of text.split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (textWidth(t, font) <= width || !line) line = t;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

// Cria canvas com o texto. block = {width, maxLines, spacing, justify}
function makeTextCanvas(text, font, block) {
  const lh = fontLineHeight(font);
  if (!block) {
    const w = Math.max(1, Math.ceil(textWidth(text, font)) + 1);
    const c = newCanvas(w, lh); drawTextLine(c.getContext('2d'), text, font, 0, 0, '#000');
    return { canvas: c, baseline: fontBaseline(font) };
  }
  let lines = wrapText(text, font, block.width);
  if (block.maxLines && lines.length > block.maxLines) {
    const keep = lines.slice(0, block.maxLines);
    keep[keep.length - 1] = [keep[keep.length - 1], ...lines.slice(block.maxLines)].join(' ');
    lines = keep;
  }
  const n = Math.max(lines.length, block.fixedLines ? block.maxLines : 0);
  const step = lh + (block.spacing || 0);
  const c = newCanvas(block.width, n * step - (block.spacing || 0));
  const ctx = c.getContext('2d');
  lines.forEach((ln, i) => {
    const tw = textWidth(ln, font); let x = 0;
    if (block.justify === 'C') x = (block.width - tw) / 2;
    else if (block.justify === 'R') x = block.width - tw;
    if (block.justify === 'J' && i < lines.length - 1 && ln.includes(' ')) {
      const words = ln.split(' '); const tot = words.reduce((a, w) => a + textWidth(w, font), 0);
      const gap = (block.width - tot) / (words.length - 1); let xx = 0;
      words.forEach(w => { drawTextLine(ctx, w, font, xx, i * step, '#000'); xx += textWidth(w, font) + gap; });
    } else drawTextLine(ctx, ln, font, Math.round(x), i * step, '#000');
  });
  return { canvas: c, baseline: (n - 1) * step + fontBaseline(font) };
}

/* ------------------------- códigos de barras ----------------------- */
const RATIO_TYPES = new Set(['code39', 'code39ext', 'interleaved2of5', 'rationalizedCodabar', 'code11', 'industrial2of5', 'matrix2of5', 'datalogic2of5', 'iata2of5', 'coop2of5']);

function eanCheck(d) {
  let s = 0; const r = d.split('').reverse();
  r.forEach((c, i) => s += (+c) * (i % 2 === 0 ? 3 : 1));
  return String((10 - s % 10) % 10);
}
function prepEAN(data, len) { // len = dígitos sem verificador
  let d = data.replace(/\D/g, '');
  if (d.length > len) d = d.slice(0, len);
  d = d.padStart(len, '0');
  return d + eanCheck(d);
}

/* spec: {bcid, text, opts, module, ratio, height, hr, hrAbove, hrText, rowHeight}
   devolve {canvas, top, bottom} — top/bottom = faixa das barras no canvas */
function makeBarcodeCanvas(spec, hrFont) {
  const raw = bwipjs.raw(spec.bcid, spec.text, Object.assign({}, spec.opts || {}));
  const sym = raw[0];
  const mod = Math.max(1, Math.round(spec.module || 2));
  if (sym.pixs) { // 2D
    const cols = sym.pixx, rows = sym.pixy;
    const mh = spec.rowHeight ? Math.max(1, Math.round(spec.rowHeight)) : mod;
    const c = newCanvas(cols * mod, rows * mh); const ctx = c.getContext('2d'); ctx.fillStyle = '#000';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      if (sym.pixs[y * cols + x]) ctx.fillRect(x * mod, y * mh, mod, mh);
    return { canvas: c, top: 0, bottom: c.height };
  }
  const ratio = spec.ratio || 3;
  const wide = Math.max(mod + 1, Math.round(mod * ratio));
  const isRatio = RATIO_TYPES.has(spec.bcid);
  const widths = sym.sbs.map(v => isRatio ? (v > 1.01 ? wide : mod) : Math.round(v * mod));
  const total = widths.reduce((a, b) => a + b, 0);
  const h = Math.max(1, Math.round(spec.height || 50));
  let textH = 0, gap = 0;
  const hr = spec.hr && spec.hrText;
  if (hr) { textH = fontLineHeight(hrFont); gap = Math.max(2, Math.round(hrFont.h * 0.15)); }
  const RETAIL = { ean13: { guards: [[0, 3], [45, 50], [92, 95]], groups: [[1, 7, 3, 45], [7, 13, 50, 92]], lead: 1 },
                   ean8: { guards: [[0, 3], [31, 36], [64, 67]], groups: [[0, 4, 3, 31], [4, 8, 36, 64]], lead: 0 },
                   upca: { guards: [[0, 10], [45, 50], [85, 95]], groups: [[1, 6, 10, 45], [6, 11, 50, 85]], lead: 1, trail: 1 } };
  const rt = hr && !spec.hrAbove && RETAIL[spec.bcid];
  if (rt) {
    const dw = textWidth('0', hrFont), pad = Math.round(dw + mod * 2);
    const left = rt.lead ? pad : 0, right = rt.trail ? pad : 0;
    const ext = Math.round(textH / 2 + gap);
    const c = newCanvas(left + total + right, h + textH + gap);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#000';
    let x = 0, m = 0;
    sym.sbs.forEach((v, i) => {
      const w = Math.round(v * mod);
      if (i % 2 === 0) { const g = rt.guards.some(([a, b]) => m >= a && m < b); ctx.fillRect(left + x, 0, w, h + (g ? ext : 0)); }
      x += w; m += v;
    });
    const t = spec.hrText, ty = h + gap;
    if (rt.lead) drawTextLine(ctx, t[0], hrFont, 0, ty, '#000');
    if (rt.trail) drawTextLine(ctx, t[t.length - 1], hrFont, left + total + mod * 2, ty, '#000');
    for (const [a, b, m0, m1] of rt.groups) {
      const str = t.slice(a, b), tw = textWidth(str, hrFont);
      drawTextLine(ctx, str, hrFont, Math.round(left + (m0 + m1) / 2 * mod - tw / 2), ty, '#000');
    }
    return { canvas: c, top: 0, bottom: h };
  }
  const c = newCanvas(total, h + (hr ? textH + gap : 0));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#000';
  const top = hr && spec.hrAbove ? textH + gap : 0;
  let x = 0;
  widths.forEach((w, i) => { if (i % 2 === 0) ctx.fillRect(x, top, w, h); x += w; });
  if (hr) {
    const tw = textWidth(spec.hrText, hrFont);
    const ty = spec.hrAbove ? 0 : h + gap;
    drawTextLine(ctx, spec.hrText, hrFont, Math.round((total - tw) / 2), ty, '#000');
  }
  return { canvas: c, top, bottom: top + h };
}

function errorCanvas(w, h, msg) {
  const c = newCanvas(Math.max(w, 60), Math.max(h, 30)); const ctx = c.getContext('2d');
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  ctx.strokeRect(1, 1, c.width - 2, c.height - 2);
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(c.width, c.height); ctx.moveTo(c.width, 0); ctx.lineTo(0, c.height); ctx.stroke();
  return c;
}

/* ------------------------- imagens (bitmaps) ----------------------- */
function bitmapCanvas(bytes, bpr, rows, oneIsBlack = true, mx = 1, my = 1) {
  const w = bpr * 8;
  const c = newCanvas(w, rows); const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, rows); const d = img.data;
  for (let y = 0; y < rows; y++) for (let x = 0; x < w; x++) {
    const b = bytes[y * bpr + (x >> 3)] || 0; const bit = (b >> (7 - (x & 7))) & 1;
    if (bit === (oneIsBlack ? 1 : 0)) { const o = (y * w + x) * 4; d[o + 3] = 255; }
  }
  ctx.putImageData(img, 0, 0);
  if (mx === 1 && my === 1) return c;
  const s = newCanvas(w * mx, rows * my); const sctx = s.getContext('2d'); sctx.imageSmoothingEnabled = false;
  sctx.drawImage(c, 0, 0, s.width, s.height); return s;
}

/* ------------------------- renderizador ---------------------------- */
// Operações:
//  {t:'shape', path:(ctx)=>void, color:'B'|'W', rev}
//  {t:'canvas', canvas, x, y, rot:0|90|180|270, mode:'bbox'|'anchor', ax, ay, rev, color}
function placeCanvas(ctx, op) {
  let src = op.canvas;
  if (op.rev || op.color === 'W') { // tinge de branco
    const t = newCanvas(src.width, src.height); const tc = t.getContext('2d');
    tc.drawImage(src, 0, 0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = '#fff'; tc.fillRect(0, 0, t.width, t.height);
    src = t;
  }
  ctx.save();
  if (op.rev) ctx.globalCompositeOperation = 'difference';
  const w = src.width, h = src.height, rot = ((op.rot || 0) % 360 + 360) % 360;
  ctx.translate(Math.round(op.x), Math.round(op.y));
  if (op.mode === 'bboxbl') { ctx.translate(0, -(rot % 180 ? w : h)); }
  if (op.mode === 'bbox' || op.mode === 'bboxbl') {
    if (rot === 90) ctx.translate(h, 0); else if (rot === 180) ctx.translate(w, h); else if (rot === 270) ctx.translate(0, w);
    ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(src, 0, 0);
  } else {
    ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(src, -Math.round(op.ax || 0), -Math.round(op.ay || 0));
  }
  ctx.restore();
}

function renderLabel(label) {
  const c = newCanvas(label.w, label.h); const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (label.offY) ctx.translate(0, label.offY);
  for (const op of label.ops) {
    try {
      if (op.t === 'shape') {
        ctx.save();
        if (op.rev) { ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; }
        else ctx.fillStyle = op.color === 'W' ? '#fff' : '#000';
        ctx.beginPath(); op.path(ctx); ctx.fill('evenodd'); ctx.restore();
      } else if (op.t === 'canvas') placeCanvas(ctx, op);
    } catch (e) { console.warn(e); }
  }
  if (label.rot180) {
    const r = newCanvas(c.width, c.height); const rc = r.getContext('2d');
    rc.translate(c.width, c.height); rc.rotate(Math.PI); rc.drawImage(c, 0, 0); return r;
  }
  return c;
}

// formas geométricas
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function boxOp(x, y, w, h, t, color, rev, rounding /*0..8*/, tv) {
  // t = espessura horizontal das linhas laterais; tv = espessura das linhas sup/inf (default t)
  tv = tv == null ? t : tv;
  const rad = rounding ? (rounding / 8) * Math.min(w, h) / 2 : 0;
  return { t: 'shape', color, rev, bb: [x, y, w, h], path: ctx => {
    roundRectPath(ctx, x, y, w, h, rad);
    if (2 * t < w && 2 * tv < h) roundRectPath(ctx, x + t, y + tv, w - 2 * t, h - 2 * tv, Math.max(0, rad - Math.max(t, tv)));
  } };
}
function ellipseOp(x, y, w, h, t, color, rev) {
  return { t: 'shape', color, rev, path: ctx => {

          bw = rw; bh = rh; bx = o.x; by = o.mode === 'bboxbl' ? o.y - bh : o.y;
        } else continue;
        minY = Math.min(minY, by); maxX = Math.max(maxX, bx + bw);
      }
      if (minY < 0) { l.offY = Math.ceil(-minY) + margin; l.h += l.offY; warn(`Conteúdo maior que a altura informada: área ampliada para ${(l.h / dpi * 25.4).toFixed(0)} mm (o arquivo não informa a altura da etiqueta)`); }
      if (maxX > l.w) { l.w = Math.ceil(maxX) + margin; warn(`Conteúdo maior que a largura informada: área ampliada para ${(l.w / dpi * 25.4).toFixed(0)} mm`); }
    }
  }
  return labels;
}

/* ===================================================================
   Detecção de linguagem
   =================================================================== */
function detectLang(src) {
  if (/\^XA/i.test(src) || /~DG/i.test(src)) return 'zpl';
  let ppla = 0, epl = 0;
  if (/\x02L|<STX>L/i.test(src)) ppla += 5;
  for (const raw of src.split(/\r?\n/).slice(0, 400)) {
    const l = raw.replace(/^[\x00-\x1f\s]+/, '');
    if (/^[1-4][0-9A-Za-z]{4}\d{3}\d{4}\d{4}/.test(l) || /^[1-4]W1/.test(l)) ppla++;
    if (/^(A|B)\d+,\d+,[0-3],/.test(l) || /^(LO|LE|LW|X)\d+,\d+,/.test(l) || /^q\d+/.test(l) || /^Q\d+,/.test(l) || /^N$/.test(l) || /^P\d+/.test(l) || /^b\d+,\d+,/.test(l)) epl++;
  }
  if (ppla === 0 && epl === 0) return /\^[A-Z]{2}/.test(src) ? 'zpl' : 'epl';
  return ppla > epl ? 'ppla' : 'epl';
}

function cfgFromUI() {
  const dpi = +$('dpi').value; const dpmm = { 152: 6, 203: 8, 300: 12, 600: 24 }[dpi];
  return {
    dpi, dpmm,
    w: Math.round(num($('wmm').value, 100) * dpi / 25.4),
    h: Math.round(num($('hmm').value, 50) * dpi / 25.4),
    sizeMode: $('sizeMode').value, pplaOrigin: $('pplaOrigin').value
  };
}

async function render() {
  const src = $('src').value; const cfg = cfgFromUI();
  try { localStorage.setItem('etq.src', src); } catch (e) {}
  const stage = $('stage'), warnsEl = $('warns');
  const warns = new Set(); const warn = m => warns.add(m);
  if (!src.trim()) {
    stage.innerHTML = '<div class="empty">Nenhuma etiqueta ainda.<br>Abra um arquivo, cole o código ou escolha um exemplo.</div>';
    $('stLang').textContent = '—'; $('stSize').textContent = '—'; $('stCount').textContent = '—'; warnsEl.innerHTML = ''; return;
  }
  if (!window.bwipjs) { warn('Biblioteca de códigos de barras não carregou — verifique a conexão.'); }
  try { await document.fonts.load(`700 20px "Roboto Condensed"`); await document.fonts.load(`700 20px "Roboto Mono"`); } catch (e) {}
  let lang = $('lang').value; const auto = lang === 'auto'; if (auto) lang = detectLang(src);
  let labels = [];
  try {
    if (lang === 'zpl') labels = await parseZPL(src, cfg, warn);
    else if (lang === 'epl') labels = await parseEPL(src, cfg, warn);
    else labels = await parsePPLA(src, cfg, warn);
  } catch (e) { warn('Erro ao interpretar: ' + (e.message || e)); console.error(e); }
  $('stLang').textContent = lang.toUpperCase() + (auto ? ' (auto)' : '');
  $('stCount').textContent = labels.length + (labels.length === 1 ? ' etiqueta' : ' etiquetas');
  stage.innerHTML = '';
  if (!labels.length) stage.innerHTML = '<div class="empty">Nenhuma etiqueta encontrada no código.<br>Confira a linguagem selecionada.</div>';
  const zoomSel = $('zoom').value, viewRot = +$('viewRot').value;
  labels.forEach((lab, idx) => {
    let canvas = renderLabel(lab);
    if (viewRot) {
      const sw = viewRot % 180 ? canvas.height : canvas.width, sh = viewRot % 180 ? canvas.width : canvas.height;
      const r = newCanvas(sw, sh); const rc = r.getContext('2d');
      rc.translate(sw / 2, sh / 2); rc.rotate(viewRot * Math.PI / 180); rc.drawImage(canvas, -canvas.width / 2, -canvas.height / 2); canvas = r;
    }
    const wrap = document.createElement('div'); wrap.className = 'labelwrap';
    const paper = document.createElement('div'); paper.className = 'paper';
    const img = new Image(); img.src = canvas.toDataURL('image/png'); img.alt = 'Etiqueta ' + (idx + 1);
    let scale;
    if (zoomSel === 'fit') { const avail = Math.max(200, stage.clientWidth - 70); scale = Math.min(avail / canvas.width, 1.6); }
    else scale = +zoomSel;
    img.style.width = Math.round(canvas.width * scale) + 'px'; img.style.height = Math.round(canvas.height * scale) + 'px';
    img.addEventListener('mousemove', ev => {
      const r = img.getBoundingClientRect();
      let x = Math.floor((ev.clientX - r.left) / scale), y = Math.floor((ev.clientY - r.top) / scale);
      $('coord').textContent = `x ${x} · y ${y} pontos`;
    });
    img.addEventListener('mouseleave', () => $('coord').textContent = '');
    paper.appendChild(img); wrap.appendChild(paper);
    const cap = document.createElement('div'); cap.className = 'cap';
    const mmw = (lab.w / cfg.dpi * 25.4).toFixed(1), mmh = (lab.h / cfg.dpi * 25.4).toFixed(1);
    const cp = lab.copies > 1 ? ` · ${lab.copies} cópias` : ' · 1 cópia';
    cap.textContent = `Etiqueta ${idx + 1}${cp} — ${lab.w}×${lab.h} pontos (${mmw}×${mmh} mm)`;
    const dl = document.createElement('a'); dl.className = 'btn'; dl.textContent = 'Baixar PNG';
    dl.href = img.src; dl.download = `etiqueta-${idx + 1}.png`; dl.style.textDecoration = 'none';
    wrap.appendChild(cap); wrap.appendChild(dl); stage.appendChild(wrap);
    if (idx === 0) $('stSize').textContent = `${mmw}×${mmh} mm @ ${cfg.dpi} dpi`;
  });
  warnsEl.innerHTML = '';
  for (const w of warns) { const d = document.createElement('div'); d.textContent = '⚠ ' + w; warnsEl.appendChild(d); }
}
function schedule() { clearTimeout(state.timer); state.timer = setTimeout(render, 250); }

function loadFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const bytes = new Uint8Array(fr.result);
    let txt;
    try { txt = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
    catch (e) { txt = ''; for (let i = 0; i < bytes.length; i += 8192) txt += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); }
    $('src').value = txt; render();
  };
  fr.readAsArrayBuffer(file);
}

$('btnOpen').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
$('btnClear').onclick = () => { $('src').value = ''; render(); };
$('example').onchange = e => { const k = e.target.value; if (k) { $('src').value = EXAMPLES[k]; $('lang').value = 'auto'; render(); } e.target.value = ''; };
$('src').addEventListener('input', schedule);
['lang', 'dpi', 'wmm', 'hmm', 'sizeMode', 'pplaOrigin', 'viewRot', 'zoom'].forEach(id => $(id).addEventListener('change', render));
const ta = $('src');
ta.addEventListener('dragover', e => { e.preventDefault(); ta.classList.add('drop'); });
ta.addEventListener('dragleave', () => ta.classList.remove('drop'));
ta.addEventListener('drop', e => { e.preventDefault(); ta.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('resize', () => { if ($('zoom').value === 'fit') schedule(); });

(function init() {
  let saved = null; try { saved = localStorage.getItem('etq.src'); } catch (e) {}
  $('src').value = saved || EXAMPLES.zpl;
  render();
})();
